[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "paid-media-agent"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "google-cloud-bigquery>=3.25.0",
    "google-auth>=2.35.0",
    "google-api-python-client>=2.150.0",
    "simple-salesforce>=1.12.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "schedule>=1.2.2",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
# Google Ads API — Task 21
# Large dependency tree (~100 MB). Install only on instances that run the Google Ads adapter.
# Usage: pip install 'paid-media-agent[google_ads]'
# Or individually: pip install 'google-ads>=24.1.0' 'google-auth-oauthlib>=1.2.0' pyyaml
google_ads = [
    "google-ads>=24.1.0",
    "google-auth-oauthlib>=1.2.0",
    "pyyaml>=6.0",
]

# Meridian MMM — Task 27
# Google's open-source Bayesian Media Mix Model library with JAX/NumPyro backend.
# ~800 MB total (JAX + TensorFlow Probability + Meridian). Install only on instances
# that run the MMM pipeline (dedicated Cloud Run service or local analyst workstation).
# Usage: pip install 'paid-media-agent[mmm]'
#
# Cloud Run requirements (set as env vars on the MMM service):
#   XLA_FLAGS = "--xla_force_host_platform_device_count=4"
#   JAX_PLATFORM_NAME = "cpu"
#   Memory: minimum 8 GB RAM (16 GB recommended for n_draws=500, 5+ geos)
#   CPU: minimum 4 vCPUs (maps to 4 JAX virtual devices for parallel chains)
#   Timeout: 3600 seconds (Cloud Run max — needed for n_draws=500)
mmm = [
    "google-meridian>=0.1.0",
    "jax[cpu]>=0.4.30",
    "numpyro>=0.15.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",    # BigQuery → pandas transport (to_dataframe())
]

# Causal Impact Analysis — Task 24
# Bayesian Structural Time Series (BSTS) using the TFP-JAX substrate.
# tensorflow-probability[jax] uses JAX/XLA directly — does NOT require TensorFlow Core.
# Shares jax[cpu] with the [mmm] group; install both at once with:
#   pip install 'paid-media-agent[mmm,causal]'
#
# Cloud Run requirements (set alongside MMM env vars if co-deployed):
#   XLA_FLAGS = "--xla_force_host_platform_device_count=4"  (shared with MMM)
#   JAX_PLATFORM_NAME = "cpu"
#   Memory: 4 GB minimum for n_draws=200, T_pre<180
#   Timeout: 600 seconds (HMC for BSTS is faster than full MMM)
causal = [
    "tensorflow-probability[jax]>=0.24.0",
    "jax[cpu]>=0.4.30",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]

# Social Listening — Task 25
# Google Trends (direct HTTP + DataForSEO provider) + Reddit PRAW adapter.
# textblob is optional — the client degrades to a lexicon-based sentiment scorer
# if textblob is not installed. praw and requests are required.
# Usage: pip install 'paid-media-agent[social]'
social = [
    "praw>=7.8.0",
    "requests>=2.32.0",
    "textblob>=0.18.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
