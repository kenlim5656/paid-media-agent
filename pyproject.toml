[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "paid-media-agent"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "google-cloud-bigquery>=3.25.0",
    "google-auth>=2.35.0",
    "google-api-python-client>=2.150.0",
    "simple-salesforce>=1.12.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "schedule>=1.2.2",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
# Google Ads API — Task 21
# Large dependency tree (~100 MB). Install only on instances that run the Google Ads adapter.
# Usage: pip install 'paid-media-agent[google_ads]'
# Or individually: pip install 'google-ads>=24.1.0' 'google-auth-oauthlib>=1.2.0' pyyaml
google_ads = [
    "google-ads>=24.1.0",
    "google-auth-oauthlib>=1.2.0",
    "pyyaml>=6.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
